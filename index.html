.ct{font:700 3.4cqw 'Playfair Display',serif;letter-spacing:.35cqw;color:#0B2A6F}.cs{font-size:1.7cqw;color:#5B6785}.cn{font:400 7cqw 'Great Vibes',cursive;color:#0B2A6F;line-height:1.1;overflow-wrap:anywhere}.cc{font:700 3cqw 'Playfair Display',serif;color:#FF7A1A}
.cf{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:2cqw}.cv{font-weight:700;font-size:1.7cqw}.cl2{font-size:1.3cqw;color:#5B6785}
.seal{width:8cqw;height:8cqw;border-radius:50%;background:radial-gradient(#FFC83D,#FF7A1A);border:.5cqw double #fff;box-shadow:0 0 0 .4cqw #FF7A1A;display:grid;place-items:center;color:#fff}.seal .i{width:4cqw;height:4cqw;stroke-width:3}
.sig{display:grid;gap:.3cqw;justify-items:center}.sig img{height:6cqw;max-width:20cqw;object-fit:contain}.sgt{font:400 4cqw 'Great Vibes',cursive;color:#0B2A6F}.sgl{width:70%;border-top:.2cqw solid #0B2A6F}.cno{font-size:1.2cqw;color:#5B6785;letter-spacing:.15cqw}
.thr{max-height:55vh;min-height:140px;overflow:auto;display:grid;gap:8px;padding:12px;background:var(--bg);border-radius:16px;align-content:start}.bb{max-width:82%;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--bd);justify-self:start;overflow-wrap:anywhere}.bb.me{justify-self:end;background:var(--bl2);color:#fff;border-color:transparent}.bb small{display:block;opacity:.85;font-size:11px;margin-top:4px}.tk .i{width:12px;height:12px;stroke-width:3;margin-right:-5px}
.cg2{display:grid;gap:14px}@media(min-width:900px){.cg2{grid-template-columns:1fr 1fr}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:380px){.row2{grid-template-columns:1fr}}
.st-pr{background:#d6f5e3;color:#0b6b36}.st-wn{background:#fff2c9;color:#7a5a00}.st-er{background:#fde0e0;color:#a31d1d}.mn{color:var(--mut);font-weight:600}[hidden]{display:none!important}
.rec{background:var(--er)!important;color:#fff!important;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.6}}.bb audio{width:min(240px,100%);height:38px;display:block}

<div id="root"><div style="display:grid;place-items:center;height:100vh"><div class="spin"></div></div></div>

<script>
const CFG=window.APP_CONFIG||{URL:"",KEY:""};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic=n=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const $=s=>document.querySelector(s),root=$("#root"),go=h=>{location.hash=h};
const MAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
let sb,S={u:null,p:null,c:null,m:[],done:new Set(),R:0,tab:"stats",days:30,cid:null,t:[],n:0,q:null,tf:null,gate:false,set:{},cc:""},D={};
const adm=()=>S.p?.role==="super_admin",prem=()=>S.p&&(S.p.status==="PREMIUM"||adm()),ok=m=>m.is_free||prem();
const done=()=>S.m.filter(x=>S.done.has(x.id)).length,pct=()=>S.m.length?Math.round(done()/S.m.length*100):0;
const money=(n,c)=>`<span class="money">${(+n||0).toLocaleString(LC(),{maximumFractionDigits:2})}\u00A0${c==="USD"?"$":esc(c||"")}</span>`;
const price=()=>S.c?money(S.c.price,S.c.currency):money(10,"USD");
async function load(){
 const{data:{session}}=await sb.auth.getSession();S.u=session?.user||null;S.p=null;S.done=new Set();S.gate=false;S.tf=null;S.st=null;
 if(S.u){const[l,f]=await Promise.all([sb.auth.mfa.getAuthenticatorAssuranceLevel(),sb.auth.mfa.listFactors()]);S.gate=l.data?.nextLevel==="aal2"&&l.data?.currentLevel!=="aal2";S.tf=f.data?.totp?.[0]||null}
 const{data:ss}=await sb.from("site_settings").select("key,value");S.set=Object.fromEntries((ss||[]).map(x=>[x.key,x.value]));{const{data:pmx}=await sb.from("payment_methods").select("*").eq("active",true).order("sort");S.pmeth=pmx||[]}initPix();rt();
 const[c,m,te,sn]=await Promise.all([sb.from("courses").select("*").order("created_at").limit(1),sb.from("module_list").select("*").order("position"),sb.from("testimonials").select("*").order("created_at",{ascending:false}).limit(6),sb.rpc("student_count")]);S.t=te.data||[];S.n=sn.data||0;
 S.c=c.data?.[0]||null;S.m=(m.data||[]).filter(x=>!S.c||x.course_id===S.c.id);
 if(S.u){const[p,g]=await Promise.all([sb.from("profiles").select("*").eq("id",S.u.id).single(),sb.from("progress").select("module_id").eq("completed",true)]);S.p=p.data;S.done=new Set((g.data||[]).map(x=>x.module_id));const sr=await sb.from("staff_roles").select("*").eq("user_id",S.u.id).maybeSingle();S.st=sr.data||null}
 render()}
const cta=(t,c="")=>`<button class="btn ${c}" onclick="go('${S.p?(prem()?'#/formation':'#/paiement'):'#/inscription'}')">${t}</button>`;
const nav=()=>`<nav><div class="w">${S.p?`<button class="ib burger" aria-label="Menu" onclick="drawer()">${ic("menu")}</button>`:""}<div class="logo" onclick="go('#/')"><span>FB</span>Store <b>Academy</b></div>${S.p?`<div class="usr">${lgBtn()}<span class="pill ${staff()?"ad":prem()?"pr":""}">${adm()?"ADMIN":S.st?esc(S.st.role.toUpperCase()):prem()?"PREMIUM":"GRATUIT"}</span>${prem()?"":`<button class="btn s" onclick="go('#/paiement')">Passer Premium</button>`}<div class="av" role="button" tabindex="0" aria-label="Mon profil" onclick="go('#/profil')" style="cursor:pointer">${esc((S.p.name||"?")[0].toUpperCase())}</div></div>`:`<div class="row">${lgBtn()}<button class="btn s g" onclick="go('#/connexion')">Connexion</button><button class="btn s" onclick="go('#/inscription')">Commencer</button></div>`}</div></nav>`;
const li=t=>`<div class="card" style="display:flex;gap:12px;align-items:center"><span class="ok">${ic("check")}</span>${t}</div>`;
function landing(){return nav()+`<header class="hero"><div class="w"><div><span class="tag">${ic("plane")} Chine vers Afrique</span><h1 style="margin-top:16px">Apprenez à acheter en Chine et à livrer en Afrique</h1>
<p>Trouvez des produits, vérifiez les fournisseurs, négociez les prix et importez depuis Alibaba, 1688 et Pinduoduo directement avec votre téléphone.</p>
<div class="row">${cta(ic("cap")+"Commencer la formation")}<a class="btn g" style="color:#fff;border-color:#fff5" href="#/" onclick="document.getElementById('how').scrollIntoView();return false">${ic("play")}Voir comment ça fonctionne</a></div></div>
<div class="phone"><b class="h">Alibaba · 1688 · Pinduoduo</b><div class="it">${ic("search")}Produits tendance</div><div class="it">${ic("shield")}Fournisseur vérifié</div><div class="it">${ic("card")}Prix négocié</div><div class="it">${ic("plane")}Livraison en RDC</div></div></div></header>
<section><div class="w"><h2>Vous voulez importer de Chine mais vous ne savez pas par où commencer ?</h2><div class="grid">${["Vous ne savez pas où trouver les bons fournisseurs","Vous avez peur des arnaques","Vous ne savez pas négocier les prix","Vous ne comprenez pas les commandes","Vous ne savez pas comment faire livrer en RDC","Vous avez peur de perdre votre argent"].map(x=>`<div class="card bad" style="display:flex;gap:12px;align-items:center"><div class="ico">${ic("x")}</div>${x}</div>`).join("")}</div>
<p class="h" style="margin:28px 0;font-size:20px;text-align:center">Cette formation vous montre exactement quoi faire, étape par étape.</p><div class="row" style="justify-content:center">${cta(ic("cap")+"Je veux apprendre à importer")}</div></div></section>
<section id="how" style="background:var(--card)"><div class="w"><h2>Ce que vous allez apprendre</h2><div class="grid">${["Alibaba, 1688 et Pinduoduo","Recherche de produits","Recherche et vérification des fournisseurs","Comparaison des prix et négociation","Commande et paiements","Organiser la livraison","Éviter les arnaques","Calculer votre coût et votre marge","Préparer votre activité"].map(li).join("")}</div></div></section>
<section><div class="w"><h2>${S.m.length||12} modules pratiques</h2><div class="grid">${S.m.map((m,i)=>`<div class="card"><div class="row sp"><div class="ico">${ic(["book","cog","search","shield","cap","card","users","check","card","plane","shield","play"][i%12])}</div>${m.is_free?'<span class="tag">Gratuit</span>':ic("lock")}</div><h3 style="margin:12px 0 2px">${esc(m.title)}</h3><small class="mn">Module ${String(i+1).padStart(2,"0")}</small></div>`).join("")}</div></div></section>
<section style="background:var(--card)"><div class="w"><div class="price"><span class="tag">Formation Premium</span><div class="n">${price()}</div><p style="color:var(--mut)">Une compétence qui peut vous servir bien au-delà de cette formation.</p><ul>${["Accès à la formation complète","Modules pratiques en vidéo","Alibaba, 1688 et Pinduoduo","Recherche de fournisseurs et négociation","Méthodes pour éviter les arnaques","Accès depuis téléphone ou ordinateur"].map(x=>`<li><span class="ok">${ic("check")}</span>${x}</li>`).join("")}</ul>${cta(ic("card")+"Accéder à la formation — "+price(),"f")}</div>
${S.t.length?`<h2 style="margin:44px 0 20px;text-align:center">Ils ont suivi la formation</h2><div class="grid">${S.t.map(x=>`<div class="card"><p style="color:var(--ink)">« ${esc(x.text)} »</p><h3>${esc(x.name)}</h3></div>`).join("")}</div>`:""}<div class="trust"><span>${ic("lock")}Paiement sécurisé</span><span>${ic("play")}Accessible sur téléphone</span>${S.n>0?`<span>${ic("users")}${S.n} élèves formés</span>`:""}</div></div></section>
<section><div class="w" style="max-width:760px"><h2>Questions fréquentes</h2>${[["Puis-je suivre la formation sur mon téléphone ?","Oui. La plateforme est pensée d'abord pour le mobile et peut s'installer comme une application."],["La première vidéo est-elle gratuite ?","Oui. Créez votre compte et regardez le module 1 sans payer."],["Comment payer ?","Depuis la page de paiement, avec les moyens qui y sont proposés (Mobile Money notamment)."],["J'ai un code promo, où le saisir ?","Sur la page de paiement, dans le champ « Code promo »."]].map(x=>`<details class="card" style="margin-bottom:10px"><summary style="font-weight:700;cursor:pointer">${x[0]}</summary><p style="margin-top:8px">${x[1]}</p></details>`).join("")}</div></section>
<div class="fin"><h2>Votre téléphone peut devenir votre outil pour apprendre, rechercher des produits et développer votre activité.</h2><p style="margin-bottom:22px">Commencez aujourd'hui. Formation Premium — ${price()}</p>${cta(ic("cap")+"Commencer la formation","y")}<div style="margin-top:24px">${lgLink("background:transparent;color:#fff;border-color:#fff6")}</div></div>`}
function auth(sign){return nav()+`<div class="form"><div class="card"><h2 class="h">${sign?"Créez votre compte":"Bienvenue sur FBStore Academy"}</h2>
${sign?`<label>Nom complet<input id="n" autocomplete="name"></label>`:""}<label>Email<input id="e" type="email" inputmode="email" autocomplete="email" placeholder="vous@exemple.com"></label>${sign?`<label>Téléphone<input id="t" type="tel" autocomplete="tel" placeholder="+243…"></label>`:""}
<label>Mot de passe<input id="p" type="password" autocomplete="${sign?"new":"current"}-password"></label>${sign?`<label>Confirmer le mot de passe<input id="c" type="password" autocomplete="new-password"></label>`:""}
<div class="err" id="er" role="alert"></div><button class="btn f" id="sub" onclick="${sign?"signup()":"login()"}">${sign?"Créer mon compte":"Se connecter"}</button>
<button class="btn g f" onclick="try{localStorage.setItem('fbgo',String(Date.now()))}catch(e){}sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}})">Continuer avec Google</button>
<p style="font-size:14px;color:var(--mut)">${sign?`Vous avez déjà un compte ? <a href="#/connexion">Se connecter</a>`:`<a href="#/inscription">Créer un compte</a> · <a href="#/oubli">Mot de passe oublié ?</a>`}</p></div></div>`}
const er=(t,g)=>{const e=$("#er");e.className=g?"msg":"err";e.textContent=/permission denied/i.test(t)?"Droits manquants dans la base de données : exécutez sql/upgrade8.sql dans Supabase (SQL Editor).":t};
async function signup(){const v=i=>$("#"+i).value.trim();
 if(v("n").length<2)return er("Entrez votre nom complet.");if(!MAIL.test(v("e")))return er("Entrez un email valide (ex. nom@domaine.com).");if(v("t").replace(/\D/g,"").length<8)return er("Entrez un numéro de téléphone valide.");
 if($("#p").value.length<8)return er("Mot de passe : 8 caractères minimum.");if($("#p").value!==$("#c").value)return er("Les mots de passe ne correspondent pas.");
 $("#sub").disabled=true;const{data,error}=await sb.auth.signUp({email:v("e").toLowerCase(),password:$("#p").value,options:{data:{name:v("n"),phone:v("t")},emailRedirectTo:location.origin+location.pathname}});$("#sub").disabled=false;
 if(error)return er(error.message.includes("registered")?"Cet email a déjà un compte. Connectez-vous.":error.message);
 trk("CompleteRegistration");if(data.session)load().then(()=>go("#/dash"));else er("Compte créé. Cliquez sur le lien envoyé à votre email pour le confirmer, puis connectez-vous.",1)}
async function login(){const e=$("#e").value.trim().toLowerCase();if(!MAIL.test(e))return er("Entrez un email valide.");if(!$("#p").value)return er("Entrez votre mot de passe.");
 $("#sub").disabled=true;const{error}=await sb.auth.signInWithPassword({email:e,password:$("#p").value});$("#sub").disabled=false;
 if(error)return er(error.message.includes("confirm")?"Confirmez d'abord votre email (lien reçu par mail).":"Email ou mot de passe incorrect.");await load();go("#/dash")}
async function reset(){const e=($("#e")?.value||"").trim();if(!MAIL.test(e))return er("Entrez votre email puis cliquez à nouveau.");await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});er("Si ce compte existe, un email de réinitialisation a été envoyé.",1)}
const tabs=(k,s)=>[["dash","home","Accueil"],["formation","cap","Formation"],["progression","chart","Progression"],["communaute","users","Communauté"],["transitaires","plane","Transitaires"],["calculateur","calc","Calculateur"],["support","chat","Support"],["profil","user","Profil"],...(staff()?[["admin","cog","Admin"]]:[])].map(x=>`<a class="${k===x[0]?"on":""}" onclick="go('#/${x[0]}')">${ic(x[1])}${x[2]}</a>`).join("");
const shell=(k,b,r="")=>nav()+`<div class="app ${r?"r":""}"><aside class="side">${tabs(k)}</aside><main>${b}</main>${r?`<aside>${r}</aside>`:""}</div>${botNav(k)}`;
const player=m=>`<div class="vid" id="vid" style="${m?.thumbnail?`background:linear-gradient(#0007,#0007),url('${esc(m.thumbnail)}') center/cover`:""}"><div><div class="play">${ic("play")}</div><b>${esc(m?m.title:"Introduction")}</b></div></div>`;
async function vid(m){if(!m||!$("#vid"))return;const{data}=await sb.from("modules").select("video_path,video_url").eq("id",m.id).single();

function initVP(){const v=$("#vv"),c=$("#vp");if(!v)return;const f=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0")},ico=(id,n)=>{$(id).innerHTML=ic(n)},tog=()=>v.paused?v.play():v.pause();
